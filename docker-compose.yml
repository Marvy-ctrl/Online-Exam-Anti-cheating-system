      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-snapshots}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-you@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      SMTP_FROM: ${SMTP_FROM:-you@gmail.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-api_key}
