      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      JWT_SECRET_EXAMINER: ${JWT_SECRET_EXAMINER:-insecure_examiner_secret}
      JWT_SECRET_STUDENT: ${JWT_SECRET_STUDENT:-insecure_student_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      DOMAIN: ${DOMAIN:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-snapshots}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-you@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      SMTP_FROM: ${SMTP_FROM:-you@gmail.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-api_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-api_secret}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.40}
