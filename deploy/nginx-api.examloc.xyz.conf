# ExamLoc API — nginx vhost for api.examloc.xyz
#
# Install:
#   sudo cp deploy/nginx-api.examloc.xyz.conf /etc/nginx/sites-available/api.examloc.xyz
#   sudo ln -s /etc/nginx/sites-available/api.examloc.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.examloc.xyz
#
# This adds ONE new vhost. It does not touch the project already on this VPS —
# nginx routes by server_name, so your existing sites are unaffected.

# Maps the Upgrade header so WebSockets survive the proxy. `map` is only valid
# in the http{} context; files in sites-enabled/ are included there, so this is
# fine at the top of this file.
# If you already declare $connection_upgrade elsewhere, DELETE this block —
# a duplicate map directive will fail `nginx -t`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.examloc.xyz;

    # certbot rewrites this to a 443 block and adds its own redirect.

    # Face enrollment POSTs five base64-encoded JPEGs in a single request body.
    # nginx defaults to 1 MB, which fails that request with a 413 that surfaces
    # in the browser as a generic network error. Base64 inflates by ~33%.
    client_max_body_size 25M;
    client_body_timeout 120s;

    # ── WebSockets: live proctoring + examiner monitor ──────────────────────
    # Must precede the catch-all `location /`.
    # nginx's default proxy_read_timeout of 60s would drop these idle sockets
    # between heartbeats.
    location ~ ^/api/v1/exam_session/.*/ws$ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Everything else ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # uvicorn runs with --proxy-headers and reads this to build correct
        # https:// URLs behind TLS termination.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Face verification is queued, but snapshot proxying streams from MinIO.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # CORS is handled by FastAPI's CORSMiddleware from FRONTEND_URL.
    # Do NOT add add_header Access-Control-* here — duplicate CORS headers
    # cause browsers to reject the response outright.
}
