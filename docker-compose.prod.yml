# ExamLoc — staging deployment for a shared VPS.
#
# Differences from docker-compose.yml (local dev):
#   1. Postgres / Redis / MinIO publish NO host ports. They are reachable only
#      on the internal Docker network. On a public VPS, an exposed unauthenticated
#      Redis is compromised within hours.
#   2. The API binds to 127.0.0.1 only. Your existing reverse proxy fronts it
#      and terminates TLS. Nothing in this file competes for port 80/443.
#   3. Redis requires a password.
#   4. No insecure secret fallbacks. A missing .env fails the boot loudly
#      instead of silently starting with "insecure_examiner_secret".
#   5. env_file replaces four duplicated 25-line environment blocks.
#   6. Log rotation caps, so this cannot fill the disk shared with your other project.
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
#
# NOTE: keep the API at a single uvicorn worker. ConnectionManager holds
# WebSockets in process memory (src/websocket.py), so a second worker would
# silently drop monitor alerts for whichever examiners land on the other process.

services:
  postgres:
    image: postgres:16-alpine
    container_name: examloc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: examloc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: examloc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build: ./backend
    image: examloc-api
    container_name: examloc-api
    restart: unless-stopped
    # Loopback only. The reverse proxy reaches this; the internet does not.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: uvicorn src:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  worker-face:
    build: ./backend
    image: examloc-api
    container_name: examloc-faceworker
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=face --pool=solo --concurrency=1
    logging: *default-logging

  worker-grading:
    build: ./backend
    image: examloc-api
    container_name: examloc-gradingworker
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=grading --pool=solo --concurrency=1
    logging: *default-logging

  worker-email:
    build: ./backend
    image: examloc-api
    container_name: examloc-emailworker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=default --pool=solo --concurrency=2
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
